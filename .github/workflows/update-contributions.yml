name: Update contribution cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - featured-prs.json
      - .github/workflows/update-contributions.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile
        uses: actions/checkout@v4

      - name: Check out contribution card generator
        uses: actions/checkout@v4
        with:
          repository: dbwls99706/OpenSource-contribution-card
          path: .contribution-card

      - name: Generate contribution cards
        env:
          GITHUB_USERNAME: hrhrng
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEATURED_PRS_PATH: ./featured-prs.json
          OUTPUT_PATH: ./contributions.svg
          THEME: light
          PREVIEW_THEMES: dark
          MAX_REPOS: "8"
          SORT_BY: count
          TITLE: Three Years of Contributions
          WIDTH: "846"
          LOCALE: en-US
        run: |
          rm -f contributions.svg contributions-dark.svg
          timeout 75s node .contribution-card/src/index.js || test -s contributions.svg -a -s contributions-dark.svg

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contributions.svg contributions-dark.svg
          git diff --cached --quiet || git commit -m "chore: refresh contribution cards [skip ci]"
          git push
